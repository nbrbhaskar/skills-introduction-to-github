<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RTGS — Department GIS Layers</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-sA+e2Yk9g+g3gGk9U5xgkq3s3T5Q5rjvD2v9g6rXqkg=" crossorigin="" />
  <style>
    html,body{height:100%;margin:0;font-family: Arial, Helvetica, sans-serif;background:#f0f4f8}
    #header{width:100%;background:#fff;border-bottom:2px solid #e2e8f0}
    #header img{max-height:70px;}
    #app{display:flex;gap:12px;padding:12px;box-sizing:border-box;height:calc(100% - 80px)}
    .left{width:240px}
    .panel{height:100%;border:2px solid #4a5568;border-radius:10px;padding:10px;background:#2d3748;overflow-y:auto}
    .btn{display:block;width:100%;margin:8px 0;padding:12px 10px;border-radius:8px;background:#4299e1;color:#fff;border:none;text-align:center;cursor:pointer;font-size:15px;font-weight:600;transition:background 0.3s}
    .btn.small{padding:6px;font-size:13px}
    .btn:hover{background:#2b6cb0}
    .right{flex:1;border:2px solid #4a5568;border-radius:10px;overflow:hidden;position:relative}
    #map{width:100%;height:100%}
    .topbar{position:absolute;top:14px;left:14px;z-index:1000}
    .info{background:rgba(0,0,0,0.7);color:#fff;padding:6px 10px;border-radius:4px;font-size:14px}
    input[type=file]{display:none}
  </style>
</head>
<body>
  <!-- Header Banner -->
  <div id="header">
    <img src="27092edb-49b7-4eca-adad-73a40adafd1e.png" alt="RTGS Header">
  </div>

  <div id="app">
    <div class="left">
      <div class="panel">
        <button class="btn" data-dept="admin">Administrative Boundary</button>
        <button class="btn" data-dept="power">Power</button>
        <button class="btn" data-dept="agri">Agriculture</button>
        <button class="btn" data-dept="civil">Civil Supplies</button>
        <button class="btn" data-dept="roads">Roads & Buildings</button>
        <button class="btn" data-dept="revenue">Revenue Dept</button>
        <button class="btn" data-dept="telecom">Telecom</button>
        <button class="btn" data-dept="tourism">Tourism</button>
        <button class="btn" data-dept="transport">Transport</button>
        <button class="btn small" data-dept="swachh">Swachh Andhra Corporation</button>
        <button class="btn" data-dept="water">Water Resources</button>
        <button class="btn small" data-dept="women">Women and Child Welfare</button>
        <button class="btn" data-dept="disaster">Disaster Management</button>
      </div>
      <!-- File input for GeoJSON -->
      <input type="file" id="geojsonFile" accept=".geojson,.json">
    </div>

    <div class="right">
      <div id="map"></div>
      <div class="topbar"><span class="info" id="title">Click a department and select a GeoJSON file</span></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-o9N1j8D3Qm5Hjv0l2hKxQ5b0QwGk8f2D5jv2o2rT1qM=" crossorigin=""></script>
  <script>
    const map = L.map('map', {center: [16.5, 80.6], zoom: 7});

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    let currentLayer = null;
    let currentDept = null;

    // Open file input when button clicked
    document.querySelectorAll('.btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentDept = btn.getAttribute('data-dept');
        document.getElementById('geojsonFile').click();
      });
    });

    // Load and display GeoJSON file
    document.getElementById('geojsonFile').addEventListener('change', function(event){
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const geojson = JSON.parse(e.target.result);
          if (currentLayer) {
            map.removeLayer(currentLayer);
          }
          currentLayer = L.geoJSON(geojson, {
            style: {color:'#3182ce', weight:2, fillOpacity:0.25},
            onEachFeature: (feature, layer) => {
              layer.bindPopup(`<strong>${currentDept}</strong>`);
            }
          }).addTo(map);
          const bounds = currentLayer.getBounds();
          if (bounds.isValid()) map.fitBounds(bounds.pad(0.2));
          document.getElementById('title').textContent = `${currentDept.toUpperCase()} Layer Loaded`;
        } catch (err) {
          alert('Invalid GeoJSON file');
        }
      };
      reader.readAsText(file);
    });
  </script>
</body>
</html>
